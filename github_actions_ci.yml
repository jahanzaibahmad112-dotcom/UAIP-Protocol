name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # LINT AND CODE QUALITY
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
        pip install -r requirements.txt
    
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Run black (check only)
      run: |
        black --check --line-length 100 .
    
    - name: Run mypy (type checking)
      run: |
        mypy gateway.py sdk.py compliance.py settlement.py privacy.py --ignore-missing-imports
      continue-on-error: true  # Don't fail build on type errors yet

  # ============================================================================
  # SECURITY CHECKS
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements.txt
    
    - name: Run bandit (security linter)
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . --severity-level medium
    
    - name: Run safety (dependency vulnerability check)
      run: |
        safety check --json || true
      continue-on-error: true  # Don't fail build, just warn
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  # ============================================================================
  # TESTS
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      env:
        ADMIN_KEY: test-admin-key-for-ci-minimum-32-characters-long
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt
    
    - name: Start gateway
      env:
        ADMIN_KEY: test-admin-key-for-ci-minimum-32-characters-long
      run: |
        python gateway.py &
        sleep 10  # Wait for gateway to start
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --timeout=60
    
    - name: Check gateway health
      run: |
        curl -f http://localhost:8000/health || exit 1

  # ============================================================================
  # DOCKER BUILD
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: uaip:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run -d --name uaip-test -p 8000:8000 \
          -e ADMIN_KEY=test-admin-key-for-ci-minimum-32-characters-long \
          uaip:test
        sleep 15
        curl -f http://localhost:8000/health || exit 1
        docker logs uaip-test
        docker stop uaip-test

  # ============================================================================
  # DOCUMENTATION CHECK
  # ============================================================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check for broken links in markdown
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
      continue-on-error: true  # Don't fail build on broken links
    
    - name: Check documentation files exist
      run: |
        files=(
          "README.md"
          "QUICKSTART.md"
          "ARCHITECTURE.md"
          "API.md"
          "INTEGRATIONS.md"
          "CONTRIBUTING.md"
          "CHANGELOG.md"
          "LICENSE"
        )
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done

  # ============================================================================
  # BUILD STATUS
  # ============================================================================
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint, security, test, integration, docker, docs]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "Lint failed"
          exit 1
        fi
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Tests failed"
          exit 1
        fi
        if [ "${{ needs.integration.result }}" != "success" ]; then
          echo "Integration tests failed"
          exit 1
        fi
        if [ "${{ needs.docker.result }}" != "success" ]; then
          echo "Docker build failed"
          exit 1
        fi
        echo "All checks passed! ✅"
